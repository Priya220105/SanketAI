<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SanketAI — Sign Language Recognizer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #13131a;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --green: #22c55e;
    --orange: #f97316;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* header */
  header {
    width: 100%;
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    border-bottom: 1px solid #1e1e2e;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--muted); font-size: 0.75rem; }

  /* main layout */
  main {
    width: 100%;
    max-width: 1100px;
    padding: 2rem;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
  }

  /* camera card */
  .camera-card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #1e1e2e;
    position: relative;
  }
  .camera-card img {
    width: 100%;
    display: block;
  }
  .camera-label {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    color: var(--accent2);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* right panel */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 1.5rem;
    border: 1px solid #1e1e2e;
  }
  .card-label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* letter display */
  .letter-display {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .big-letter {
    font-family: 'Syne', sans-serif;
    font-size: 5rem;
    font-weight: 800;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    transition: all 0.2s;
  }
  .big-letter.low { background: #1e1e2e; color: var(--muted); }

  .conf-info { flex: 1; }
  .conf-value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--green);
    transition: color 0.3s;
  }
  .conf-value.medium { color: var(--orange); }
  .conf-value.low    { color: var(--red); }
  .conf-bar-bg {
    height: 6px;
    background: #1e1e2e;
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .conf-bar {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.3s, background 0.3s;
  }
  .conf-bar.medium { background: var(--orange); }
  .conf-bar.low    { background: var(--red); }

  /* sentence box */
  .sentence-box {
    background: #0d0d14;
    border: 1px solid #1e1e2e;
    border-radius: 10px;
    padding: 1rem;
    min-height: 80px;
    font-size: 1.5rem;
    letter-spacing: 4px;
    color: var(--accent2);
    word-break: break-all;
    font-family: 'Syne', sans-serif;
  }
  .sentence-box:empty::before {
    content: 'Start signing...';
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 1px;
    font-family: 'Space Mono', monospace;
  }

  /* buttons */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.5rem;
  }
  .btn {
    padding: 0.75rem 0.5rem;
    border: none;
    border-radius: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-space  { background: var(--accent);  color: white; }
  .btn-back   { background: #1e1e2e; color: var(--text); }
  .btn-clear  { background: #1e1e2e; color: var(--red); }
  .btn-speak  {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    padding: 1rem;
    font-size: 0.85rem;
  }
  .btn-speak:hover { opacity: 0.9; }

  /* status dot */
  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* tip box */
  .tips { font-size: 0.7rem; color: var(--muted); line-height: 1.8; }
  .tips span { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">SanketAI</div>
    <div class="tagline">Real-time ASL Sign Language Recognition</div>
  </div>
  <div style="margin-left:auto" class="status">
    <div class="dot"></div> LIVE
  </div>
</header>

<main>
  <!-- camera feed -->
  <div class="camera-card">
    <div class="camera-label">📷 Live Feed</div>
    <img src="/video_feed" alt="Camera feed">
  </div>

  <!-- right panel -->
  <div class="panel">

    <!-- current letter -->
    <div class="card">
      <div class="card-label">Detected Letter</div>
      <div class="letter-display">
        <div class="big-letter low" id="bigLetter">?</div>
        <div class="conf-info">
          <div class="conf-value low" id="confValue">0%</div>
          <div style="font-size:0.7rem;color:var(--muted);margin-top:2px">confidence</div>
          <div class="conf-bar-bg">
            <div class="conf-bar low" id="confBar" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- sentence -->
    <div class="card">
      <div class="card-label">Sentence Builder</div>
      <div class="sentence-box" id="sentence"></div>
      <div style="margin-top:1rem">
        <div class="btn-row">
          <button class="btn btn-space"  onclick="addSpace()">SPACE</button>
          <button class="btn btn-back"   onclick="backspace()">⌫ DEL</button>
          <button class="btn btn-clear"  onclick="clearAll()">CLEAR</button>
          <button class="btn btn-speak"  onclick="speak()">🔊 SPEAK SENTENCE</button>
        </div>
      </div>
    </div>

    <!-- tips -->
    <div class="card tips">
      <div class="card-label">How to use</div>
      <span>GREEN box</span> = high confidence (confirmed)<br>
      <span>ORANGE box</span> = medium, keep holding<br>
      <span>RED / ?</span> = adjust your hand<br><br>
      Hold each sign steady for <span>~0.5s</span> to confirm it
    </div>

  </div>
</main>

<script>
  // poll server every 200ms for current state
  setInterval(async () => {
    const res  = await fetch('/state');
    const data = await res.json();

    // update letter
    const letterEl = document.getElementById('bigLetter');
    letterEl.textContent = data.letter || '?';
    letterEl.className = 'big-letter' + (data.letter ? '' : ' low');

    // update confidence
    const conf = data.confidence;
    const confEl  = document.getElementById('confValue');
    const barEl   = document.getElementById('confBar');
    confEl.textContent = conf + '%';

    const cls = conf >= 75 ? '' : conf >= 50 ? ' medium' : ' low';
    confEl.className = 'conf-value' + cls;
    barEl.className  = 'conf-bar'   + cls;
    barEl.style.width = conf + '%';

    // update sentence
    document.getElementById('sentence').textContent = data.sentence;
  }, 200);

  async function clearAll() {
    await fetch('/clear', { method: 'POST' });
  }
  async function backspace() {
    await fetch('/backspace', { method: 'POST' });
  }
  async function addSpace() {
    await fetch('/space', { method: 'POST' });
  }
  function speak() {
    const sentence = document.getElementById('sentence').textContent;
    if (!sentence.trim()) return;
    const u = new SpeechSynthesisUtterance(sentence);
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }
</script>
</body>
</html>
